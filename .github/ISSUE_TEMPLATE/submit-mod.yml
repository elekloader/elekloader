name: Submit a mod
description: Add your mod's GitHub release to elekloader's shop. A check runs on the release and opens a pull request for a maintainer.
title: "Submit a mod: "
labels: [mod-submission]
body:
  - type: markdown
    attributes:
      value: |
        Publish your mod's `.elemod` files in a GitHub release first (a release or a pre-release, not a draft), or commit them to your repository and give the commit. More in [docs/SHOP.md](https://github.com/elekloader/elekloader/blob/main/docs/SHOP.md). When you submit this form, a check:
        - downloads the files and checks each against the sha256 GitHub lists;
        - reads each with elekloader: its id, version, device, OS, licence and requirements;
        - checks that the site has what each mod needs: a core for its device and OS, as new as the one it names, and any mod it requires (the shop's, or one from your release, which comes along);
        - comments here with what it found.

        If files pass, it opens a pull request that adds them to the shop, and a maintainer reviews and merges it. Edit this issue to fix anything, and the check runs again.

        After that you only publish releases: a daily check finds your newer releases and updates your mods in the shop by itself (you can opt out below). Lines `Shop summary: ...` and `Tested on a unit: ...` in a release's notes change your card's text.
  - type: input
    id: repo
    attributes:
      label: Repository
      description: owner/name, as on GitHub (for example irpina/digislicer).
      placeholder: owner/name
    validations:
      required: true
  - type: input
    id: tag
    attributes:
      label: Release tag
      description: The release that carries the .elemod files, such as v1.0. Leave it empty if you give a commit instead.
      placeholder: v1.0
  - type: input
    id: commit
    attributes:
      label: Or a commit
      description: If you keep your .elemod files in the repository rather than in a release, the whole 40-character id of the commit to take them from. The shop pins that commit; later commits come in through this form again.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One sentence the shop shows on the mod's card.
    validations:
      required: true
  - type: textarea
    id: on_unit
    attributes:
      label: Tested on a unit
      description: What you have checked on real hardware, and what not yet. The shop shows it.
  - type: input
    id: license
    attributes:
      label: Licence, for files that name none
      description: The repository's licence as an SPDX id (MIT, GPL-2.0-or-later, …). The shop passes a mod on only under a licence that allows it.
  - type: textarea
    id: files
    attributes:
      label: Only these files
      description: The .elemod files to submit, one per line, if not all of the release's. Mods they require from the release come with them.
  - type: checkboxes
    id: updates
    attributes:
      label: Updates
      description: By default the shop takes your newer releases of these mods by itself, once a day, with the same checks. You can also put `Shop auto-update: off` in a release's notes.
      options:
        - label: Don't update these mods automatically; I'll send each new release through this form.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I wrote these mods, or their licence allows them to be passed on.
          required: true
        - label: The files carry no Elektron firmware, only the mod's own code (and the short stock fragments elekloader allows).
          required: true
