# A mod submitted with the "Submit a mod" issue form (.github/ISSUE_TEMPLATE/submit-mod.yml), or taken out with the
# "Remove a mod" form (remove-mod.yml):
# 1. packaging/submit_mod.py checks the release or the commit (or, to remove, lists what goes):
#    - it compares with the shop's current files and the latest release's cores, downloaded as pages.yml does, so
#      a mod whose core or required mods the site can't supply is refused, and a removal says which shop mods
#      need what goes;
#    - it writes web/catalog.json.
# 2. The result goes in a comment on the issue, with a note when the issue isn't the repository owner's.
# 3. A pull request makes the change, for a maintainer to review. One exception: when the repository's owner opened
#    the issue and the change touches only that repository's own entries (newer files of mods it already has in the
#    shop, with no new mod, clash, core or held entry; or a removal no other shop mod needs and nothing held), the
#    unit tests run and the pull request merges itself, then pages redeploys. The repository variable
#    SHOP_AUTO_MERGE set to false stops that.
#
# The workflow's token starts no other workflow, so it starts the tests workflow on a pull request left for review,
# and pages after a merge.
#
# The issue's text is untrusted: it reaches the script as a file, never the shell, and the script only reads the
# files (nothing in them runs). Editing the issue runs the check again and updates the same pull request.
#
# The repository needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
name: Mod submission

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write            # to start the tests and pages workflows

concurrency:
  group: mod-submission-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    if: >-
      github.event.issue.state == 'open' &&
      (contains(github.event.issue.labels.*.name, 'mod-submission') || startsWith(github.event.issue.title, 'Submit a mod') ||
       contains(github.event.issue.labels.*.name, 'mod-removal') || startsWith(github.event.issue.title, 'Remove a mod'))
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      BASE: ${{ github.event.repository.default_branch }}
      OPENER: ${{ github.event.issue.user.login }}
      MODE: ${{ (contains(github.event.issue.labels.*.name, 'mod-removal') || startsWith(github.event.issue.title, 'Remove a mod')) && 'remove' || 'submit' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The cores, from the latest release
        if: env.MODE == 'submit'
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "core-*.elemod" --dir build/core
      - name: The shop's files, to compare with
        run: |
          mkdir -p build/shop
          python packaging/build_web.py --catalog-list web/catalog.json | while read -r how repo ref path; do
            if [ "$how" = commit ]; then
              out="build/shop/${path##*/}"
              gh api "repos/$repo/contents/$path?ref=$ref" -H "Accept: application/vnd.github.raw" > "$out.part" \
                && mv "$out.part" "$out" || rm -f "$out.part"
            else
              gh release download "$ref" --repo "$repo" --pattern "$path" --dir build/shop --clobber || true
            fi
          done
      - name: Check
        id: check
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          if [ "$MODE" = remove ]; then how=--remove; else how="--cores-dir build/core"; fi
          set +e
          python packaging/submit_mod.py --issue-body "$RUNNER_TEMP/body.md" --files-dir build/shop $how \
            --report "$RUNNER_TEMP/report.md" --result "$RUNNER_TEMP/result.json" --previews "$RUNNER_TEMP/previews"
          echo "status=$?" >> "$GITHUB_OUTPUT"
          # whether the issue is the repository owner's, and the change only touches its own entries
          python -c "import json, os, sys; r = json.load(open(os.environ['RUNNER_TEMP'] + '/result.json')); owner = r['repo'].split('/')[0]; print('owner=' + owner); print('own=' + ('yes' if owner.lower() == sys.argv[1].lower() else '')); print('auto=' + ('yes' if r['auto_ok'] else ''))" "$OPENER" >> "$GITHUB_OUTPUT"
      - name: The pull request
        id: pr
        if: steps.check.outputs.status == '0'
        run: |
          branch="mod-submission/$ISSUE"
          title=$(python -c "import json, os; r = json.load(open(os.environ['RUNNER_TEMP'] + '/result.json')); print(('The shop: remove %s (%s)' % (', '.join(r['titles']) or 'a mod', r['repo'])) if r['removal'] else ('The shop: %s (%s %s)' % (', '.join(r['titles']) or 'a mod', r['repo'], r['tag'])))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add web/catalog.json
          printf '%s\n\nFrom #%s, checked by packaging/submit_mod.py.\n' "$title" "$ISSUE" > "$RUNNER_TEMP/message.txt"
          git commit -q -F "$RUNNER_TEMP/message.txt"
          git push -q -f origin "$branch"
          if [ "$MODE" = remove ]; then
            intro='Takes the files listed in #%s out of the shop. Merging it takes them off the site at the next deploy.\n\n'
          else
            intro='Adds the files checked in #%s to the shop. Merging it puts them on the site at the next deploy.\n\n'
          fi
          { printf "$intro" "$ISSUE"
            cat "$RUNNER_TEMP/report.md"
            printf '\nCloses #%s\n' "$ISSUE"; } > "$RUNNER_TEMP/pr.md"
          url=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [ -n "$url" ]; then
            gh pr edit "$url" --title "$title" --body-file "$RUNNER_TEMP/pr.md" >/dev/null
          else
            url=$(gh pr create --base "$BASE" --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/pr.md")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # many new thumbnails: their pixels, as text, in comments (the report says how many); each set once
          if ls "$RUNNER_TEMP"/previews/previews-*.md >/dev/null 2>&1; then
            mark=$(head -n 1 "$RUNNER_TEMP/previews/previews-1.md")
            if ! gh pr view "$url" --json comments --jq '.comments[].body' | grep -qF -- "$mark"; then
              for f in $(ls "$RUNNER_TEMP"/previews/previews-*.md | sort -V); do
                gh pr comment "$url" --body-file "$f" >/dev/null
              done
            fi
          fi
      - name: Merge an author's own change
        id: merge
        if: steps.pr.outputs.url != ''
        env:
          PR: ${{ steps.pr.outputs.url }}
          OWN: ${{ steps.check.outputs.own }}
          AUTO: ${{ steps.check.outputs.auto }}
          AUTO_MERGE: ${{ vars.SHOP_AUTO_MERGE != 'false' }}
        run: |
          if [ "$AUTO_MERGE" = true ] && [ -n "$OWN" ] && [ -n "$AUTO" ]; then
            if python tests/test_units.py > "$RUNNER_TEMP/units.txt" 2>&1; then
              gh pr merge "$PR" --squash --delete-branch
              gh workflow run pages.yml --ref "$BASE"
              echo "merged=yes" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tail -n 40 "$RUNNER_TEMP/units.txt"
            echo "failed=yes" >> "$GITHUB_OUTPUT"
          fi
          gh workflow run tests.yml --ref "mod-submission/$ISSUE"
      - name: The comment and labels
        if: always() && steps.check.outputs.status != ''
        env:
          STATUS: ${{ steps.check.outputs.status }}
          PR: ${{ steps.pr.outputs.url }}
          OWNER: ${{ steps.check.outputs.owner }}
          OWN: ${{ steps.check.outputs.own }}
          MERGED: ${{ steps.merge.outputs.merged }}
          FAILED: ${{ steps.merge.outputs.failed }}
        run: |
          label=mod-submission
          if [ "$MODE" = remove ]; then label=mod-removal; fi
          gh label create mod-submission --color 1d76db --description "Submitted with the Submit a mod form" --force >/dev/null
          gh label create mod-removal --color 5319e7 --description "Opened with the Remove a mod form" --force >/dev/null
          gh label create needs-changes --color e99695 --description "The check found something to fix" --force >/dev/null
          { cat "$RUNNER_TEMP/report.md"
            if [ -n "$MERGED" ]; then
              printf '\nMerged: %s. It changes only your repository'"'"'s own entries, so it goes in without a review; the site redeploys in a few minutes.\n' "$PR"
            elif [ -n "$PR" ]; then
              printf '\nPull request: %s\n' "$PR"
              if [ -n "$FAILED" ]; then printf 'The unit tests failed on it, so it waits for a maintainer.\n'; fi
              if [ -z "$OWN" ] && [ -n "$OWNER" ]; then
                printf 'It waits for a maintainer: this issue is from %s, not from %s, who owns the repository.\n' "$OPENER" "$OWNER"
              fi
            fi; } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" --edit-last --body-file "$RUNNER_TEMP/comment.md" 2>/dev/null \
            || gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
          if [ "$STATUS" = 1 ]; then
            gh issue edit "$ISSUE" --add-label "$label" --add-label needs-changes >/dev/null
          else
            gh issue edit "$ISSUE" --add-label "$label" --remove-label needs-changes >/dev/null
          fi
